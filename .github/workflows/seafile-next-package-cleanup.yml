name: Seafile Next package cleanup

on:
  push:
    tags:
      - 'seafile-next-cleanup-*'

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove superseded image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          CURRENT_TAG: 13.0.25-next.1
        run: |
          version_ids="$(gh api --paginate \
            "/users/${PACKAGE_OWNER}/packages/container/seafile-mc/versions?per_page=100" \
            --jq ".[] | select(((.metadata.container.tags // []) | index(\"${CURRENT_TAG}\")) == null) | .id")"
          for version_id in $version_ids; do
            gh api --method DELETE \
              "/users/${PACKAGE_OWNER}/packages/container/seafile-mc/versions/${version_id}"
          done
